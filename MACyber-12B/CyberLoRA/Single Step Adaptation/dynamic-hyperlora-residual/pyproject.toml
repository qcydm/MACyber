[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-hyperlora-residual"
version = "0.1.0"
description = "PoC for Dynamic HyperLoRA-Residual"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.46.0",
  "peft>=0.14.0",
  "accelerate>=1.2.0",
  "hydra-core>=1.3.2",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.0",
  "pytest>=8.3.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "real_backbone_smoke: optional smoke test for real backbone training/evaluation",
]
